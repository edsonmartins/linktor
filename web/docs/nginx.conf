server {
    # 8080 porque a imagem nginx sem privilégios não faz bind abaixo de 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # llms.txt e llms-full.txt são texto com acentos: sem isto o navegador
    # adivinha a codificação e erra.
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # O Docusaurus gera uma pasta com index.html por página.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # /assets tem hash de conteúdo no nome: pode ficar em cache para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imagens e fontes sem hash: cache curto, para uma troca aparecer no dia.
    location ~* \.(?:woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
