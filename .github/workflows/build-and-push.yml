name: build-and-push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Override image tag
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: integrall-tech

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: Dockerfile
            image: linktor-backend
          - name: admin
            context: web/admin
            dockerfile: web/admin/Dockerfile
            image: linktor-admin
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.linktor.dev/api/v1
              NEXT_PUBLIC_WS_URL=wss://api.linktor.dev/api/v1/ws
              NEXT_PUBLIC_WEBHOOK_BASE_URL=https://api.linktor.dev
          - name: landing
            context: web/landing
            dockerfile: web/landing/Dockerfile
            image: linktor-landing

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Images publish under the integrall-tech org, but this repo lives under a
      # different owner, so the automatic GITHUB_TOKEN cannot push there ('the
      # requested installation does not exist'). Authenticate with a PAT that has
      # write:packages on integrall-tech, provided via the GHCR_ORG_TOKEN secret.
      # Set GHCR_ORG_USERNAME if the PAT belongs to an account other than the
      # workflow actor.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_ORG_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_ORG_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}"
          TAGS=""
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAGS="$IMAGE:${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS="$IMAGE:${GITHUB_REF#refs/tags/},$IMAGE:latest"
          else
            TAGS="$IMAGE:latest,$IMAGE:sha-${GITHUB_SHA::7}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "primary=${TAGS%%,*}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: false

  # CD por webhook: dispara o receiver adnanh/webhook na VPS
  # (deploy.linktor.dev), que puxa a tag recém-publicada e recria os serviços.
  # Requer o secret DEPLOY_TOKEN (mesmo valor de /opt/linktor-devops/.env).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.linktor.dev
    steps:
      - name: Compute deploy tag
        id: tag
        run: |
          # A tag DEVE bater com a que o job build publicou:
          # tags v* → o próprio ref; senão → sha-<7 primeiros>.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger CD webhook
        run: |
          # Com tentativa única, uma intermitência de rede vira pipeline vermelho
          # e redeploy manual. Já aconteceu duas vezes com a MESMA assinatura —
          # 05/08 e 14/08, ambas "curl: (28) Failed to connect ... after ~136s".
          # O host é o mesmo que serve api./app., que respondem normalmente
          # minutos depois, então é a conexão TCP que falha, não o receiver.
          #
          # --connect-timeout evita queimar 136s numa tentativa que não vai
          # completar; a espera progressiva dá tempo de a rede se recuperar.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
              --connect-timeout 10 --max-time 30 \
              -X POST "https://deploy.linktor.dev/hooks/deploy" \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"env\":\"production\",\"component\":\"all\",\"tag\":\"${{ steps.tag.outputs.tag }}\"}") || code=000
            echo "tentativa $attempt: HTTP $code"; cat /tmp/resp.txt 2>/dev/null || true

            if [ "$code" = "200" ]; then
              echo "deploy despachado"
              exit 0
            fi

            # Token inválido não melhora com repetição — falha na hora.
            if [ "$code" = "403" ]; then
              echo "::error::CD webhook recusou o token (HTTP 403)"
              exit 1
            fi

            if [ "$attempt" -lt 5 ]; then
              espera=$((attempt * 15))
              echo "nova tentativa em ${espera}s…"
              sleep "$espera"
            fi
          done
          echo "::error::CD webhook falhou após 5 tentativas (último HTTP $code)"
          exit 1

      - name: Smoke test (aguarda o rollout)
        run: |
          # Verifica que a VERSÃO NOVA subiu, não apenas que a API responde.
          #
          # A versão anterior deste passo consultava /health logo após despachar
          # o deploy e recebia 200 do container ANTIGO, passando em 0,4s. Ele
          # nunca observou o rollout: em 14/08 o webhook falhou, o deploy não
          # aconteceu, e este passo teria dado verde do mesmo jeito.
          alvo="${{ steps.tag.outputs.tag }}"
          echo "aguardando a API reportar version=$alvo"

          for i in $(seq 1 30); do
            atual=$(curl -fsS --max-time 10 https://api.linktor.dev/health 2>/dev/null \
              | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')

            if [ "$atual" = "$alvo" ]; then
              echo "rollout confirmado: version=$atual"
              exit 0
            fi

            echo "($i/30) version=${atual:-sem-resposta}, esperando…"
            sleep 15
          done

          # Sem o campo version, a API é anterior a esta mudança: não dá para
          # confirmar o rollout, e falhar aqui seria alarme falso.
          if [ -z "$atual" ] && curl -fsS --max-time 10 https://api.linktor.dev/health >/dev/null 2>&1; then
            echo "::warning::API responde mas não reporta version — rollout não verificado"
            exit 0
          fi

          echo "::error::rollout não confirmado após 7min (esperado $alvo, obtido ${atual:-sem-resposta})"
          exit 1
