name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  # Validates that the goose migrations build the schema cleanly (and idempotently)
  # against a real Postgres with pgvector, and runs the DB-backed integration
  # tests (migrations, order-create rollback, message-status monotonicity) that
  # are excluded from the default unit run via the `integration` build tag.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: linktor
          POSTGRES_PASSWORD: linktor
          POSTGRES_DB: linktor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linktor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LINKTOR_DATABASE_HOST: localhost
      LINKTOR_DATABASE_PORT: "5432"
      LINKTOR_DATABASE_USER: linktor
      LINKTOR_DATABASE_PASSWORD: linktor
      LINKTOR_DATABASE_DATABASE: linktor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Migrations + DB integration tests
        run: go test -tags=integration -count=1 ./internal/infrastructure/database/...

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/admin/playwright-report
          retention-days: 7
