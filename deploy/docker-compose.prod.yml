name: linktor

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  traefik:
    # v3.7+ é necessário p/ o Docker Engine 29 (v3.2 falava API docker 1.24 <
    # mínimo 1.40 do Engine 29 → não lia labels, nenhum router/cert era criado).
    image: traefik:v3.7.7
    container_name: linktor-traefik
    <<: [*restart, *logging]
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/letsencrypt
    networks:
      - linktor-edge
      - linktor-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@file,security-headers@file"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: linktor-postgres
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linktor-internal

  redis:
    image: redis:7.4-alpine
    container_name: linktor-redis
    <<: [*restart, *logging]
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linktor-internal

  nats:
    image: nats:2.10-alpine
    container_name: linktor-nats
    <<: [*restart, *logging]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linktor-internal

  # NOTE: MinIO ended community Docker image publishing in Oct/2025; this is the
  # last known-good pinned release. Migrating to an actively-maintained image
  # (bitnami/minio, chainguard) is tracked as a follow-up decision.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: linktor-minio
    <<: [*restart, *logging]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://s3-console.${ROOT_DOMAIN}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linktor-internal
      - linktor-edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=linktor_linktor-edge"
      # MinIO S3 API
      - "traefik.http.routers.minio-api.rule=Host(`s3.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      # MinIO Console
      - "traefik.http.routers.minio-console.rule=Host(`s3-console.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.routers.minio-console.middlewares=security-headers@file"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  backend:
    image: ghcr.io/integrall-tech/linktor-backend:${BACKEND_IMAGE_TAG:-latest}
    container_name: linktor-backend
    <<: [*restart, *logging]
    environment:
      LINKTOR_SERVER_PORT: 8081
      LINKTOR_SERVER_HOST: 0.0.0.0
      LINKTOR_SERVER_MODE: release
      LINKTOR_DATABASE_HOST: postgres
      LINKTOR_DATABASE_PORT: 5432
      LINKTOR_DATABASE_USER: ${POSTGRES_USER}
      LINKTOR_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      LINKTOR_DATABASE_DATABASE: ${POSTGRES_DB}
      LINKTOR_DATABASE_SSL_MODE: disable
      LINKTOR_REDIS_HOST: redis
      LINKTOR_REDIS_PORT: 6379
      LINKTOR_REDIS_PASSWORD: ${REDIS_PASSWORD}
      LINKTOR_NATS_URL: nats://nats:4222
      LINKTOR_JWT_SECRET: ${JWT_SECRET}
      LINKTOR_CRYPTO_ENCRYPTION_KEY: ${CRYPTO_ENCRYPTION_KEY}
      # buildMediaStore() (main.go) lê variáveis MINIO_* CRUAS, não LINKTOR_S3_*.
      # As presigned URLs (TTL 7d) embutem ESTE host, então precisa ser o host
      # público (s3.<domínio>) para o cliente baixar a mídia; o minio-go usa o
      # mesmo endpoint p/ conectar e assinar (uploads fazem hairpin via Traefik).
      MINIO_ENDPOINT: s3.${ROOT_DOMAIN}
      MINIO_USE_SSL: "true"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-linktor-media}
      MINIO_REGION: us-east-1
      BASE_URL: https://api.${ROOT_DOMAIN}
      VRE_UPLOAD_DIR: /app/uploads/vre
      # Em release mode o CORS nega toda origem cross-site quando não definido
      # (403 no preflight → "failed to fetch" no admin). Libera admin + apex/www.
      LINKTOR_CORS_ALLOWED_ORIGINS: https://app.${ROOT_DOMAIN},https://${ROOT_DOMAIN},https://www.${ROOT_DOMAIN}
    volumes:
      - backend_uploads:/app/uploads
      - backend_storages:/app/storages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - linktor-internal
      - linktor-edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=linktor_linktor-edge"
      - "traefik.http.routers.backend.rule=Host(`api.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=security-headers@file,rate-limit@file"
      - "traefik.http.services.backend.loadbalancer.server.port=8081"

  admin:
    image: ghcr.io/integrall-tech/linktor-admin:${ADMIN_IMAGE_TAG:-latest}
    container_name: linktor-admin
    <<: [*restart, *logging]
    environment:
      NEXT_PUBLIC_API_URL: https://api.${ROOT_DOMAIN}/api/v1
      NEXT_PUBLIC_WS_URL: wss://api.${ROOT_DOMAIN}/api/v1/ws
      NEXT_PUBLIC_WEBHOOK_BASE_URL: https://api.${ROOT_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - linktor-edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=linktor_linktor-edge"
      - "traefik.http.routers.admin.rule=Host(`app.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin.middlewares=security-headers@file"
      - "traefik.http.services.admin.loadbalancer.server.port=3000"

  landing:
    image: ghcr.io/integrall-tech/linktor-landing:${LANDING_IMAGE_TAG:-latest}
    container_name: linktor-landing
    <<: [*restart, *logging]
    # A healthcheck embutida na imagem usa `localhost` (IPv6 ::1) mas o nginx só
    # escuta IPv4 0.0.0.0:8080 → falso "unhealthy", e o Traefik v3.7 exclui
    # containers unhealthy do roteamento. Sobrescreve com 127.0.0.1.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - linktor-edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=linktor_linktor-edge"
      - "traefik.http.routers.landing.rule=Host(`${ROOT_DOMAIN}`) || Host(`www.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing.middlewares=www-redirect@file,security-headers@file"
      - "traefik.http.services.landing.loadbalancer.server.port=8080"

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  traefik_acme:
  backend_uploads:
  backend_storages:

networks:
  linktor-edge:
    driver: bridge
  linktor-internal:
    driver: bridge
    internal: true
