<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="campHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F3460"/>
      <stop offset="100%" style="stop-color:#1A1A2E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="14" fill="white"/>

  <!-- Header -->
  <rect width="400" height="64" rx="14" fill="url(#campHeader)"/>
  <rect y="50" width="400" height="14" fill="url(#campHeader)"/>
  <text x="16" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white">Promo Black Friday</text>
  <text x="16" y="48" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">welcome_v1 · pt_BR</text>
  <!-- status badge -->
  <rect x="300" y="18" width="84" height="24" rx="12" fill="#16C79A"/>
  <text x="342" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">processing</text>

  <!-- Progress bar -->
  <rect x="16" y="84" width="320" height="10" rx="5" fill="#F0F2F5"/>
  <rect x="16" y="84" width="224" height="10" rx="5" fill="#16C79A"/>
  <text x="384" y="93" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1A1A2E" text-anchor="end">70%</text>

  <!-- Stat cards -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="16" y="108" width="68" height="52" rx="10" fill="#F8F9FB"/>
    <text x="50" y="134" font-size="18" font-weight="700" fill="#1A1A2E">2.000</text>
    <text x="50" y="150" font-size="9" fill="#8B95A2">Total</text>

    <rect x="90" y="108" width="68" height="52" rx="10" fill="#F8F9FB"/>
    <text x="124" y="134" font-size="18" font-weight="700" fill="#0F3460">1.400</text>
    <text x="124" y="150" font-size="9" fill="#8B95A2">Enviadas</text>

    <rect x="164" y="108" width="68" height="52" rx="10" fill="#E8F8F0"/>
    <text x="198" y="134" font-size="18" font-weight="700" fill="#16C79A">1.180</text>
    <text x="198" y="150" font-size="9" fill="#8B95A2">Entregues</text>

    <rect x="238" y="108" width="68" height="52" rx="10" fill="#F8F9FB"/>
    <text x="272" y="134" font-size="18" font-weight="700" fill="#0F3460">760</text>
    <text x="272" y="150" font-size="9" fill="#8B95A2">Lidas</text>

    <rect x="312" y="108" width="72" height="52" rx="10" fill="#FDECEF"/>
    <text x="348" y="134" font-size="18" font-weight="700" fill="#E94560">38</text>
    <text x="348" y="150" font-size="9" fill="#8B95A2">Falhas</text>
  </g>

  <!-- Recipients table -->
  <text x="16" y="184" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1A1A2E">Destinatários</text>
  <line x1="16" y1="192" x2="384" y2="192" stroke="#F0F2F5" stroke-width="1"/>

  <g font-family="system-ui, sans-serif" font-size="10">
    <!-- row 1 -->
    <text x="16" y="212" fill="#1A1A2E">+55 11 99999-0001</text>
    <rect x="300" y="202" width="60" height="16" rx="8" fill="#E8F8F0"/>
    <text x="330" y="213" fill="#16C79A" text-anchor="middle">delivered</text>
    <!-- row 2 -->
    <text x="16" y="234" fill="#1A1A2E">+55 11 99999-0002</text>
    <rect x="312" y="224" width="48" height="16" rx="8" fill="#E8F8F0"/>
    <text x="336" y="235" fill="#16C79A" text-anchor="middle">read</text>
    <!-- row 3 -->
    <text x="16" y="256" fill="#1A1A2E">+55 11 99999-0003</text>
    <rect x="296" y="246" width="64" height="16" rx="8" fill="#FDECEF"/>
    <text x="328" y="257" fill="#E94560" text-anchor="middle">failed</text>
    <!-- row 4 -->
    <text x="16" y="278" fill="#1A1A2E">+55 11 99999-0004</text>
    <rect x="300" y="268" width="60" height="16" rx="8" fill="#F0F2F5"/>
    <text x="330" y="279" fill="#8B95A2" text-anchor="middle">queued</text>
  </g>
</svg>
