# Restart containers unless explicitly stopped, so a crashed dependency
# (db/redis/nats) recovers on its own — matches the prod compose behavior.
x-restart: &restart
  restart: unless-stopped

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart
    container_name: linktor-postgres
    environment:
      POSTGRES_USER: linktor
      POSTGRES_PASSWORD: linktor
      POSTGRES_DB: linktor
    ports:
      - "${LINKTOR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linktor -d linktor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linktor-network

  # Redis Cache & Rate Limiting
  redis:
    image: redis:7.4-alpine
    <<: *restart
    container_name: linktor-redis
    command: redis-server --appendonly yes
    ports:
      - "${LINKTOR_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linktor-network

  # NATS JetStream Message Broker
  nats:
    image: nats:2.10-alpine
    <<: *restart
    container_name: linktor-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "${LINKTOR_NATS_PORT:-4222}:4222"   # Client connections
      - "${LINKTOR_NATS_MONITOR_PORT:-8222}:8222"   # HTTP monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      # Probe the real monitoring endpoint (the old `--help` check always
      # passed even when JetStream was unhealthy).
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linktor-network

  # MinIO - S3 Compatible Storage for Media
  # NOTE: MinIO ended community Docker image publishing in Oct/2025; this is the
  # last known-good pinned release. Migrating to an actively-maintained image
  # (bitnami/minio, chainguard) is tracked as a follow-up decision.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    <<: *restart
    container_name: linktor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: linktor
      MINIO_ROOT_PASSWORD: linktor123
    ports:
      - "${LINKTOR_MINIO_PORT:-9000}:9000"   # API
      - "${LINKTOR_MINIO_CONSOLE_PORT:-9001}:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linktor-network

  # Linktor API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *restart
    container_name: linktor-backend
    environment:
      LINKTOR_SERVER_PORT: ${LINKTOR_API_PORT:-8081}
      LINKTOR_SERVER_HOST: 0.0.0.0
      LINKTOR_SERVER_MODE: debug
      LINKTOR_DATABASE_HOST: postgres
      LINKTOR_DATABASE_PORT: 5432
      LINKTOR_DATABASE_USER: linktor
      LINKTOR_DATABASE_PASSWORD: linktor
      LINKTOR_DATABASE_DATABASE: linktor
      LINKTOR_DATABASE_SSL_MODE: disable
      LINKTOR_REDIS_HOST: redis
      LINKTOR_REDIS_PORT: 6379
      LINKTOR_NATS_URL: nats://nats:4222
      LINKTOR_JWT_SECRET: change-me-in-development
      # Local dev is plain http, so auth cookies must not require HTTPS.
      LINKTOR_JWT_COOKIE_SECURE: "false"
      BASE_URL: ${LINKTOR_BASE_URL:-http://localhost:${LINKTOR_API_PORT:-8081}}
      VRE_UPLOAD_DIR: /app/uploads/vre
    ports:
      - "${LINKTOR_API_PORT:-8081}:${LINKTOR_API_PORT:-8081}"
    volumes:
      - backend_uploads:/app/uploads
      - backend_storages:/app/storages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${LINKTOR_API_PORT:-8081}/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - linktor-network

  # Linktor Admin Dashboard
  admin:
    build:
      context: ./web/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${LINKTOR_API_PORT:-8081}/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:${LINKTOR_API_PORT:-8081}/api/v1/ws}
        NEXT_PUBLIC_WEBHOOK_BASE_URL: ${NEXT_PUBLIC_WEBHOOK_BASE_URL:-http://localhost:${LINKTOR_API_PORT:-8081}}
    <<: *restart
    container_name: linktor-admin
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${LINKTOR_API_PORT:-8081}/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:${LINKTOR_API_PORT:-8081}/api/v1/ws}
      NEXT_PUBLIC_WEBHOOK_BASE_URL: ${NEXT_PUBLIC_WEBHOOK_BASE_URL:-http://localhost:${LINKTOR_API_PORT:-8081}}
    ports:
      - "${LINKTOR_ADMIN_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - linktor-network

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
  backend_uploads:
  backend_storages:

networks:
  linktor-network:
    driver: bridge
